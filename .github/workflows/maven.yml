name: Java CI with Maven

# Fast feedback for feature branches before a pull request is opened.
# Pull requests and main are built and tested by build_backend.yml before the SonarQube scan.
on:
  push:
    branches-ignore:
      - main

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Build and test with Maven
        run: mvn -B clean verify --file backend/pom.xml
